<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoGames - Tizim</title>
    <!-- SheetJS kutubxonasi Excel faylni o'qish uchun -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background: #0056b3; }
        .switch-btn { background: none; color: #007bff; border: none; cursor: pointer; margin-top: 15px; font-size: 14px; }
        .switch-btn:hover { text-decoration: underline; }
        .hidden { display: none; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-size: 14px; }
        .info { color: #555; font-size: 11px; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- 1. Kirish oynasi -->
    <div class="card" id="loginCard">
        <h2>LudoGames - Kirish</h2>
        <input type="text" id="loginUser" placeholder="Loginni kiriting">
        <input type="password" id="loginPass" placeholder="Parolni kiriting">
        <button onclick="loginUser()">Kirish</button>
        <p class="error" id="loginError"></p>
        <button class="switch-btn" onclick="showRegister()">Akkountingiz yo'qmi? Ro'yxatdan o'ting</button>
    </div>

    <!-- 2. Ro'yxatdan o'tish oynasi -->
    <div class="card hidden" id="registerCard">
        <h2>Ro'yxatdan o'tish</h2>
        <input type="text" id="regUser" placeholder="Yangi login yarating">
        <input type="password" id="regPass" placeholder="Yangi parol yarating">
        <button onclick="registerUser()" style="background: #28a745;">Ro'yxatdan o'tish</button>
        <p class="error" id="regError"></p>
        <button class="switch-btn" onclick="showLogin()">Akkountingiz bormi? Kirish</button>
    </div>

    <!-- 3. Asosiy ilova sahifasi -->
    <div class="card hidden" id="appCard">
        <h2 class="success">Xush kelibsiz, <span id="welcomeUser"></span>!</h2>
        <p>Siz tizimga muvaffaqiyatli kirdingiz.</p>
        <button onclick="logout()" style="background: #dc3545; margin-top: 20px;">Chiqish</button>
    </div>

    <script>
        // Dropbox to'g'ridan-to'g'ri yuklab olish havolasi
        const dropboxUrl = "https://www.dropbox.com/scl/fi/mcud7j7jp64nhkhnr3l5e/LudoGames.xlsx?rlkey=3ne8tu46oyiv95p54wvb1bcoa&st=kya0tige&dl=1";

        let allUsers = [];

        // Sahifa yuklanganda Dropbox'dagi faylni va brauzer xotirasini birlashtirish
        async function initDatabase() {
            try {
                let response = await fetch(dropboxUrl);
                let data = await response.arrayBuffer();
                let workbook = XLSX.read(data, {type: 'array'});
                let sheet = workbook.Sheets[workbook.SheetNames[0]];
                let dropboxRows = XLSX.utils.sheet_to_json(sheet);
                
                // Dropbox'dagi userlarni olamiz
                allUsers = dropboxRows;
            } catch (e) {
                console.log("Dropbox faylini o'qib bo'lmadi, lokal xotiraga o'tilmoqda.");
                allUsers = [];
            }

            // Brauzer xotirasida (localStorage) saqlangan ro'yxatdan o'tganlarni qo'shamiz
            let localUsers = JSON.parse(localStorage.getItem("ludo_registered_users") || "[]");
            
            // Ikkalasini birlashtiramiz (takrorlanishni oldini olib)
            localUsers.forEach(locUser => {
                if (!allUsers.some(u => u.username === locUser.username)) {
                    allUsers.push(locUser);
                }
            });
        }

        // Dastur ishga tushishi bilan bazani yuklaymiz
        initDatabase();

        function showRegister() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("registerCard").classList.remove("hidden");
            document.getElementById("regError").innerText = "";
        }

        function showLogin() {
            document.getElementById("registerCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("loginError").innerText = "";
        }

        // Ro'yxatdan o'tish funksiyasi
        function registerUser() {
            let u = document.getElementById("regUser").value.trim();
            let p = document.getElementById("regPass").value.trim();
            let err = document.getElementById("regError");

            if (!u || !p) {
                err.innerText = "Barcha maydonlarni to'ldiring!";
                return;
            }

            // Oldindan bormi tekshiramiz
            let exists = allUsers.find(user => user.username === u);
            if (exists) {
                err.innerText = "Bu login allaqachon band qilingan!";
                return;
            }

            // Yangi user yaratish
            let newUser = { username: u, password: p };
            allUsers.push(newUser);

            // Brauzerning localStorage xotirasiga saqlaymiz (sahifa yangilanganda o'chib ketmaydi)
            let localUsers = JSON.parse(localStorage.getItem("ludo_registered_users") || "[]");
            localUsers.push(newUser);
            localStorage.setItem("ludo_registered_users", JSON.stringify(localUsers));

            alert("Muvaffaqiyatli ro'yxatdan o'tdingiz! Endi kirishingiz mumkin.");
            showLogin();
            
            document.getElementById("regUser").value = "";
            document.getElementById("regPass").value = "";
        }

        // Kirish funksiyasi
        function loginUser() {
            let u = document.getElementById("loginUser").value.trim();
            let p = document.getElementById("loginPass").value.trim();
            let err = document.getElementById("loginError");

            if (!u || !p) {
                err.innerText = "Barcha maydonlarni to'ldiring!";
                return;
            }

            // Bazadan qidirish
            let found = allUsers.find(user => user.username === u && String(user.password) === String(p));

            if (found) {
                document.getElementById("loginCard").classList.add("hidden");
                document.getElementById("appCard").classList.remove("hidden");
                document.getElementById("welcomeUser").innerText = u;
            } else {
                err.innerText = "Login yoki parol xato!";
            }
        }

        // Chiqish
        function logout() {
            document.getElementById("appCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("loginUser").value = "";
            document.getElementById("loginPass").value = "";
            document.getElementById("loginError").innerText = "";
        }
    </script>
</body>
</html>
