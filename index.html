<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoGames - Avtorizatsiya</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background: #0056b3; }
        .switch-btn { background: none; color: #007bff; border: none; cursor: pointer; margin-top: 15px; font-size: 14px; }
        .switch-btn:hover { text-decoration: underline; }
        .hidden { display: none; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Kirish oynasi -->
    <div class="card" id="loginCard">
        <h2>Tizimga kirish</h2>
        <input type="text" id="loginUser" placeholder="Login">
        <input type="password" id="loginPass" placeholder="Parol">
        <button onclick="loginUser()">Kirish</button>
        <p class="error" id="loginError"></p>
        <button class="switch-btn" onclick="showRegister()">Akkountingiz yo'qmi? Ro'yxatdan o'ting</button>
    </div>

    <!-- Ro'yxatdan o'tish oynasi -->
    <div class="card hidden" id="registerCard">
        <h2>Ro'yxatdan o'tish</h2>
        <input type="text" id="regUser" placeholder="Yangi login">
        <input type="password" id="regPass" placeholder="Yangi parol">
        <button onclick="registerUser()" style="background: #28a745;">Ro'yxatdan o'tish</button>
        <p class="error" id="regError"></p>
        <button class="switch-btn" onclick="showLogin()">Akkountingiz bormi? Kirish</button>
    </div>

    <!-- Asosiy ilova sahifasi -->
    <div class="card hidden" id="appCard">
        <h2 class="success">Xush kelibsiz, <span id="welcomeUser"></span>!</h2>
        <p>Siz LudoGames ilovasiga muvaffaqiyatli kirdingiz.</p>
        <button onclick="logout()" style="background: #dc3545; margin-top: 15px;">Chiqish</button>
    </div>

    <script>
        // --- SOZLAMALAR ---
        const GITHUB_USERNAME = "GITHUB_USERNAMINGIZ"; // Masalan: Shodiyor
        const REPO_NAME = "REPO_Nomingiz";         // Masalan: LudoGames
        const FILE_PATH = "users.json";               // Repozitoriy ichidagi fayl nomi
        const GITHUB_TOKEN = "Ggithub_token_kiri_sh_kerak"; // GitHub Settings -> Developer settings -> Personal access tokens (repo huquqi bilan)

        function showRegister() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("registerCard").classList.remove("hidden");
            document.getElementById("regError").innerText = "";
        }

        function showLogin() {
            document.getElementById("registerCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("loginError").innerText = "";
        }

        // GitHub'dan foydalanuvchilar faylini o'qish
        async function fetchUsersFromGitHub() {
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            try {
                let response = await fetch(url, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                if (!response.ok) return { users: [], sha: null };
                let data = await response.json();
                let jsonString = decodeURIComponent(escape(atob(data.content)));
                return { users: JSON.parse(jsonString), sha: data.sha };
            } catch (e) {
                console.error("O'qish xatosi:", e);
                return { users: [], sha: null };
            }
        }

        // Ro'yxatdan o'tish (GitHub fayliga yangi user yozish)
        async function registerUser() {
            let u = document.getElementById("regUser").value.trim();
            let p = document.getElementById("regPass").value.trim();
            let err = document.getElementById("regError");

            if (!u || !p) {
                err.innerText = "Barcha maydonlarni to'ldiring!";
                return;
            }

            err.innerText = "Bazaga saqlanmoqda...";

            let gitData = await fetchUsersFromGitHub();
            let users = gitData.users;
            let fileSha = gitData.sha;

            // Bunday user borligini tekshirish
            if (users.some(user => user.username === u)) {
                err.innerText = "Bu login allaqachon band qilingan!";
                return;
            }

            // Yangi user qo'shish
            users.push({ username: u, password: p });

            // GitHub faylini yangilash (Commit qilish)
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            let updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(users, null, 2))));

            try {
                let response = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Yangi foydalanuvchi qo'shildi: ${u}`,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (response.ok) {
                    alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
                    showLogin();
                    document.getElementById("regUser").value = "";
                    document.getElementById("regPass").value = "";
                } else {
                    err.innerText = "Saqlashda xatolik yuz berdi!";
                }
            } catch (e) {
                err.innerText = "Tarmoq xatosi!";
            }
        }

        // Tizimga kirish
        async function loginUser() {
            let u = document.getElementById("loginUser").value.trim();
            let p = document.getElementById("loginPass").value.trim();
            let err = document.getElementById("loginError");

            if (!u || !p) {
                err.innerText = "Barcha maydonlarni to'ldiring!";
                return;
            }

            err.innerText = "Tekshirilmoqda...";

            let gitData = await fetchUsersFromGitHub();
            let users = gitData.users;

            let found = users.find(user => user.username === u && String(user.password) === String(p));

            if (found) {
                document.getElementById("loginCard").classList.add("hidden");
                document.getElementById("appCard").classList.remove("hidden");
                document.getElementById("welcomeUser").innerText = u;
            } else {
                err.innerText = "Login yoki parol xato!";
            }
        }

        function logout() {
            document.getElementById("appCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("loginUser").value = "";
            document.getElementById("loginPass").value = "";
            document.getElementById("loginError").innerText = "";
        }
    </script>
</body>
</html>
